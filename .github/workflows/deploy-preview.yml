name: Deploy Preview

on:
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build

      - name: Apontar wrangler.toml pro banco/ambiente de preview
        run: |
          sed -i "s/00000000-0000-0000-0000-000000000000/${{ secrets.CLOUDFLARE_D1_PREVIEW_DATABASE_ID }}/" wrangler.toml
          sed -i "s/PENDING_KV_NAMESPACE_ID/${{ secrets.CLOUDFLARE_KV_NAMESPACE_ID }}/" wrangler.toml
          sed -i 's/ENVIRONMENT = "production"/ENVIRONMENT = "preview"/' wrangler.toml

      - name: Apply D1 migrations (preview)
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: d1 migrations apply DB --remote

      # Todo preview publica sob o mesmo alias fixo (--branch=preview abaixo),
      # não o nome da branch de verdade — só existe "o" preview atual, nunca
      # um por branch. Apaga qualquer deployment de preview anterior (de
      # qualquer branch) antes de publicar o novo, pra não acumular
      # deployments órfãos acessíveis pelas URLs com hash.
      - name: Apagar deployments de preview antigos
        run: |
          ids=$(npx wrangler pages deployment list --project-name=galindogamerbr-portal --environment=preview --json | jq -r '.[].Id')
          for id in $ids; do
            echo "Apagando deployment de preview antigo: $id"
            npx wrangler pages deployment delete "$id" --project-name=galindogamerbr-portal --force
          done
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      # Alias fixo em vez do nome da branch — URL estável
      # (https://preview.galindogamerbr-hub-portal.pages.dev) pra qualquer
      # branch que rodar este workflow, em vez de uma URL nova por branch.
      - name: Deploy preview to Cloudflare Pages
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist --project-name=galindogamerbr-portal --branch=preview

      # Mesmo cache KV do preview e da produção (PUBLIC_CACHE) — roda uma
      # coleta agora em vez de esperar o cron. Não derruba o job se falhar.
      - name: Disparar coleta de social stats agora
        run: |
          curl -s -X POST -H "x-trigger-secret: ${{ secrets.CRON_TRIGGER_SECRET }}" https://galindogamerbr-social-stats-cron.dignanet.workers.dev/ || true
