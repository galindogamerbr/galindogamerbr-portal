name: Deploy Cron Worker

# Worker separado (Pages Functions não suporta cron) que coleta seguidores
# por rede de hora em hora — ver workers/social-stats-cron/README.md. Só
# redeploya quando o conteúdo do worker muda (o `paths` abaixo evita rodar
# em todo push na main); workflow_dispatch permite publicar manualmente
# (ex.: primeira publicação, ou pra rodar a partir de uma branch).
on:
  push:
    branches:
      - main
    paths:
      - workers/social-stats-cron/**
      - .github/workflows/deploy-cron-worker.yml
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Injetar D1 database_id e KV namespace id
        working-directory: workers/social-stats-cron
        run: |
          sed -i "s/00000000-0000-0000-0000-000000000000/${{ secrets.CLOUDFLARE_D1_DATABASE_ID }}/" wrangler.toml
          sed -i "s/PENDING_KV_NAMESPACE_ID/${{ secrets.CLOUDFLARE_KV_NAMESPACE_ID }}/" wrangler.toml

      - name: Deploy cron worker
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: workers/social-stats-cron
          command: deploy

      # Roda uma coleta agora em vez de esperar até 20min pela próxima
      # rodada agendada — não derruba o job se falhar (o deploy em si já
      # teve sucesso, isso é só um bônus de cache morno).
      - name: Disparar coleta de social stats agora
        run: |
          curl -s -X POST -H "x-trigger-secret: ${{ secrets.CRON_TRIGGER_SECRET }}" https://galindogamerbr-social-stats-cron.dignanet.workers.dev/ || true
