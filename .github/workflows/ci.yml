name: CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

jobs:
  checks:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

      # tsc -b só cobre o frontend (tsconfig.app.json/node.json) — o
      # tsconfig raiz não referencia functions/, então erros de import ali
      # (ex: profundidade errada de "../") só apareciam no deploy real. Esse
      # comando compila as Pages Functions localmente, sem precisar de auth
      # nem deploy de verdade, e pega esse tipo de erro antes do merge.
      - name: Build Pages Functions (valida imports em functions/)
        run: npx wrangler pages functions build --outdir=/tmp/functions-build-check

      # Só nas dependências de produção — as de dev (wrangler etc.) têm
      # transitivas fora do nosso controle (ex: undici/ws) que não valem
      # travar todo PR por falta de fix upstream.
      - name: Audit de dependências de produção
        run: npm audit --omit=dev --audit-level=high

      - name: Sequência das migrations
        run: |
          expected=1
          for f in $(ls migrations/*.sql | sort); do
            base=$(basename "$f")
            num=$(echo "$base" | grep -oE '^[0-9]+')
            num=$((10#$num))
            if [ "$num" != "$expected" ]; then
              echo "::error::Migration fora de sequência: esperava $(printf '%04d' "$expected"), achei $base"
              exit 1
            fi
            expected=$((expected + 1))
          done
          echo "OK: $((expected - 1)) migrations em sequência, sem buracos nem duplicatas."
