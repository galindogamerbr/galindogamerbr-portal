name: Deploy

on:
  push:
    branches:
      - main
  # Permite forçar um redeploy sem mudar código — útil pra pegar env vars
  # novas configuradas no dashboard da Cloudflare (nem sempre aplicam sem
  # um novo deploy).
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Typecheck/lint/build/etc já rodam no ci.yml pro mesmo push — não
      # repete aqui, só builda de fato pra deployar.
      - name: Build
        run: npm run build

      - name: Injetar D1 database_id
        run: sed -i "s/00000000-0000-0000-0000-000000000000/${{ secrets.CLOUDFLARE_D1_DATABASE_ID }}/" wrangler.toml

      - name: Apply D1 migrations
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: d1 migrations apply galindogamerbr_hub --remote

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist --project-name=galindogamerbr-portal --branch=main
