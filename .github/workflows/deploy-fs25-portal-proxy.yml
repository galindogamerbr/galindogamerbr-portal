name: Deploy FS25 Portal Proxy

# Worker separado (reverse proxy) que expõe fs25.galindogamerbr.com.br pro
# portal do servidor dedicado de Farming Simulator — ver
# workers/fs25-portal-proxy/README.md. Só redeploya quando o conteúdo do
# worker muda (o `paths` abaixo evita rodar em todo push na main);
# workflow_dispatch permite publicar manualmente.
on:
  push:
    branches:
      - main
    paths:
      - workers/fs25-portal-proxy/**
      - .github/workflows/deploy-fs25-portal-proxy.yml
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Deploy proxy worker
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: workers/fs25-portal-proxy
          command: deploy
