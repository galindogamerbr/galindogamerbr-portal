name: TikTok Live Poll

# TikTok não tem API oficial pra status "ao vivo"/espectadores — esse job
# roda um cliente WebSocket de verdade (ver scripts/tiktok-live-poll/README.md
# pra entender por que isso não roda no Cloudflare Workers). A cada 5min
# (mínimo que o schedule do GitHub Actions cumpre de forma confiável).
on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

jobs:
  poll:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: scripts/tiktok-live-poll/package.json

      - name: Install dependencies
        working-directory: scripts/tiktok-live-poll
        run: npm install

      - name: Consultar status ao vivo e mandar pro site
        working-directory: scripts/tiktok-live-poll
        env:
          TIKTOK_LIVE_WEBHOOK_URL: ${{ secrets.TIKTOK_LIVE_WEBHOOK_URL }}
          TIKTOK_LIVE_WEBHOOK_SECRET: ${{ secrets.TIKTOK_LIVE_WEBHOOK_SECRET }}
        run: node poll.mjs
