name = "galindogamerbr-portal"
pages_build_output_dir = "dist"
compatibility_date = "2026-05-01"

[[d1_databases]]
binding = "DB"
database_name = "galindogamerbr_hub"
database_id = "00000000-0000-0000-0000-000000000000" # placeholder — id real só no working tree local, nunca commitado (skip-worktree ativo)
migrations_dir = "migrations"

[vars]
SESSION_COOKIE_NAME = "ggb_session"
OTP_EXPIRY_MINUTES = "10"
ENVIRONMENT = "production"

# Feature flags (Compute > Flagship no dashboard da Cloudflare) — liga/
# desliga features sem precisar de deploy. App "Instagram-Admin". app_id
# não é secreto, mas fica fora do repo por consistência com o padrão do
# database_id acima — injetado pelo workflow de deploy a partir do secret
# FLAGSHIP_APP_ID do GitHub. Preview e dev local sempre caem no fallback
# da flag (binding só resolve de verdade em produção).
[[flagship]]
binding = "FLAGS"
app_id = "FLAGSHIP_APP_ID_PLACEHOLDER"
