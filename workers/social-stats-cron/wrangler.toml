name = "galindogamerbr-social-stats-cron"
main = "src/index.ts"
compatibility_date = "2026-05-01"

[triggers]
# Métricas de API oficial (YouTube/TikTok/Instagram), sem risco de cota
# relevante nesse volume — reduzido de hora em hora pra manter o cache do
# KV (PUBLIC_CACHE, TTL 25min em cache.ts) sempre morno.
# "0 3 * * 7" = domingo 03:00 UTC = domingo meia-noite BRT (UTC-3, sem
# horário de verão desde 2019) — gatilho dedicado do backfill do total de
# visitas desde sempre (ver src/siteVisitsLifetime.ts), rodando toda semana
# no mesmo horário fixo em vez de "quando já fez uma semana desde a última
# rodada" relativo a quando o worker calhou de rodar. Cloudflare exige
# domingo como "7" aqui, não "0" (testado: "0 3 * * 0" foi rejeitado pela
# API com "invalid cron string").
crons = ["*/20 * * * *", "0 3 * * 7"]

[[d1_databases]]
binding = "DB"
database_name = "galindogamerbr_hub"
database_id = "00000000-0000-0000-0000-000000000000" # placeholder — id real só no working tree local, nunca commitado (skip-worktree ativo, ver deploy-cron-worker.yml)

# D1 separado do preview (mesmo banco que deploy-preview.yml usa) — o cron
# roda só uma vez (não tem "preview" de Worker), então escreve nos dois D1
# pra não deixar o preview com stats/post-counts vazios/desatualizados no
# fallback (o caminho quente é o KV acima, compartilhado; isso é só pro
# fallback bater também).
[[d1_databases]]
binding = "PREVIEW_DB"
database_name = "galindogamerbr_hub_preview"
database_id = "PENDING_D1_PREVIEW_DATABASE_ID" # placeholder — id real injetado no deploy via secret CLOUDFLARE_D1_PREVIEW_DATABASE_ID (ver deploy-cron-worker.yml)

[[kv_namespaces]]
binding = "PUBLIC_CACHE"
id = "PENDING_KV_NAMESPACE_ID" # placeholder — id real injetado no deploy via secret CLOUDFLARE_KV_NAMESPACE_ID (ver deploy-cron-worker.yml)

# Workers Logs da Cloudflare — persiste console.log/warn/error de cada
# execução (consultável em Workers & Pages → galindogamerbr-social-stats-cron
# → Logs), inclusive as do cron agendado (scheduled), sem precisar de
# wrangler tail ao vivo.
[observability]
enabled = true
