name = "galindogamerbr-fs25-portal-proxy"
main = "src/index.ts"
compatibility_date = "2026-05-01"

# Cloudflare provisiona DNS + SSL automaticamente pra esse domínio na conta
# (zona galindogamerbr.com.br já existe aqui) — não precisa criar registro
# DNS manualmente.
[[routes]]
pattern = "fs25.galindogamerbr.com.br"
custom_domain = true

[observability]
enabled = true
